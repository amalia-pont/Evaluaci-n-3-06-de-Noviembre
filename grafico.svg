<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Radar: PUC, U. de Chile y UDD</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
    svg  { width: 100%; height: auto; }

    /* --- Radar --- */
    .grid  { fill: none; stroke: #ddd; }
    .eje   { stroke: #aaa; }
    .texto { font-size: 12px; text-anchor: middle; }
    .escala { font-size: 10px; fill: #888; }
    .area       { fill-opacity: 0.1; stroke-width: 2; }
    .area:hover { fill-opacity: 0.2; }
    .puc { fill: #1f77b4; stroke: #1f77b4; }
    .uch { fill: #ff7f0e; stroke: #ff7f0e; }
    .udd { fill: #2ca02c; stroke: #2ca02c; }
    .item { cursor: pointer; font-size: 12px; }
    .item rect { width: 14px; height: 14px; }
    .nones   { display: none; }
    .apagado { opacity: 0.3; }
  </style>
</head>
<body>
  <h1>Radar de tres universidades</h1>
  <p>Haga clic en la leyenda para mostrar u ocultar cada universidad.</p>

  <svg viewBox="0 0 880 660" role="img" aria-label="Gráfico radar de cuatro indicadores para tres universidades">

    <!-- Centro del radar en (0,0); luego se mueve a la mitad del lienzo -->
    <g transform="translate(440 305)">

      <!-- Círculos concéntricos: uno cada 20 puntos (28,5 px por cada 20) -->
      <g class="grid">
        <circle r="29" />
        <circle r="57" />
        <circle r="86" />
        <circle r="114" />
        <circle r="143" />
        <circle r="171" />
        <circle r="200" />
        <circle r="228" />
        <circle r="257" />
      </g>

      <!-- Valores de los círculos -->
      <g class="escala" text-anchor="start">
        <text x="4" y="-27">20</text>
        <text x="4" y="-55">40</text>
        <text x="4" y="-84">60</text>
        <text x="4" y="-112">80</text>
        <text x="4" y="-141">100</text>
        <text x="4" y="-169">120</text>
        <text x="4" y="-198">140</text>
        <text x="4" y="-226">160</text>
        <text x="4" y="-255">180</text>
      </g>

      <!-- Cuatro ejes -->
      <g class="eje">
        <line x2="0"    y2="-285" />
        <line x2="285"  y2="0" />
        <line x2="0"    y2="285" />
        <line x2="-285" y2="0" />
      </g>

      <!-- Nombres de los ejes -->
      <text class="texto" x="0"    y="-297">ACADEMIC</text>
      <text class="texto" x="293"  y="4" style="text-anchor: start">ACADEMIC RANK</text>
      <text class="texto" x="0"    y="305">EMPLOYER</text>
      <text class="texto" x="-293" y="4" style="text-anchor: end">EMPLOYER RANK</text>

      <!-- Un polígono por universidad: id para JS, clase para CSS.
           Puntos en orden: arriba, derecha, abajo, izquierda -->
      <polygon id="puc" class="area puc" points="0,-86 141,0 0,118 -31,0">
        <title>Pontificia Universidad Católica</title>
      </polygon>
      <polygon id="uch" class="area uch" points="0,-75 265,0 0,112 -53,0">
        <title>Universidad de Chile</title>
      </polygon>
      <polygon id="udd" class="area udd" points="0,-80 200,0 0,104 -108,0">
        <title>Universidad del Desarrollo</title>
      </polygon>
    </g>

    <!-- Leyenda -->
    <g transform="translate(150 640)">
      <g class="item" onclick="alternar('puc', this)">
        <rect y="-11" fill="#1f77b4" />
        <text x="22">Pontificia Universidad Católica</text>
      </g>
      <g class="item" onclick="alternar('uch', this)" transform="translate(250 0)">
        <rect y="-11" fill="#ff7f0e" />
        <text x="22">Universidad de Chile</text>
      </g>
      <g class="item" onclick="alternar('udd', this)" transform="translate(440 0)">
        <rect y="-11" fill="#2ca02c" />
        <text x="22">Universidad del Desarrollo</text>
      </g>
    </g>
  </svg>

  <script>
    // Agrega o quita una clase CSS: el JS solo cambia clases, el CSS decide cómo se ve
    function alternar(id, item) {
      document.getElementById(id).classList.toggle("nones");
      item.classList.toggle("apagado");
    }
  </script>
</body>
</html>
